<!doctype html>
<!-- Generated by build.py from content/*.json and templates/*.html. Edit those, not this file. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
{{#if description}}
  <meta name="description" content="{{description}}">
{{/if}}
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
  <link rel="manifest" href="assets/favicon/site.webmanifest">
  <script>try{if(localStorage.getItem('menu')==='off')document.documentElement.classList.add('menu-off')}catch(e){}</script>
</head>
<body>
<div class="table">

  <!-- LEFT: bookmarks = go to another page, paper lines = jump inside this page -->
  <nav class="menu" id="site-menu" aria-label="Site navigation">
    <div class="bookmarks">
{{#each bookmarks}}
      <a href="{{href}}"{{#if active}} class="active"{{/if}} style="--c:var(--{{color}})" data-label="{{label}}" aria-label="{{label}}"{{#if active}} aria-current="page"{{/if}}></a>
{{/each}}
    </div>
    <div class="paper-wrap {{paper_class}}" style="--page:var(--{{page_color}})">
      <i class="under u3" aria-hidden="true"></i>
      <i class="under u2" aria-hidden="true"></i>
      <i class="under u1" aria-hidden="true"></i>
      <div class="paper">
        <ul>
{{#each paper_lines}}
          <li><a href="#{{id}}" style="--c:var(--{{color}})">{{label}}</a></li>
{{/each}}
{{#each blanks}}
          <li class="blank" aria-hidden="true"></li>
{{/each}}
        </ul>
        <svg class="doodle" viewBox="0 0 12 12" aria-hidden="true"><path d="M9 0h2v1h-2zM8 1h4v1h-4zM8 2h4v1h-4zM8 3h3v1h-3zM7 4h2v1h-2zM6 5h2v1h-2zM5 6h2v1h-2zM4 7h2v1h-2zM1 8h4v1h-4zM0 9h4v1h-4zM0 10h4v1h-4zM1 11h2v1h-2z"/></svg>
      </div>
    </div>
  </nav>

  <!-- RIGHT: blueprint sheet -->
  <div class="sheet-wrap">
    <span class="curl curl-l" aria-hidden="true"></span>
    <span class="curl curl-r" aria-hidden="true"></span>

    <main class="sheet" id="top">

      <div class="tools">
        <button class="tool tool-menu" type="button" aria-label="Show or hide the menu" aria-pressed="true" aria-controls="site-menu" data-tip-name="Menu" data-tip-text="" data-tip-val="show / hide"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1h10v1h-10zM1 4h8v1h-8zM1 7h10v1h-10zM1 10h5v1h-5z"/></svg></button>
        <span class="tool" aria-hidden="true"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M8 0h1v1h-1zM9 1h1v1h-1zM1 2h10v1h-10zM9 3h1v1h-1zM8 4h1v1h-1zM8 7h1v1h-1zM9 8h1v1h-1zM1 9h10v1h-10zM9 10h1v1h-1zM8 11h1v1h-1z"/></svg></span>
        <span class="tool" aria-hidden="true"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0h2v1h-2zM6 1h4v1h-4zM6 2h5v1h-5zM6 3h6v1h-6zM6 4h6v1h-6zM6 5h6v1h-6zM0 6h6v1h-6zM0 7h6v1h-6zM0 8h6v1h-6zM1 9h5v1h-5zM2 10h4v1h-4zM4 11h2v1h-2z"/><path class="dk" d="M4 0h2v1h-2zM2 1h4v1h-4zM1 2h5v1h-5zM0 3h6v1h-6zM0 4h6v1h-6zM0 5h6v1h-6zM6 6h6v1h-6zM6 7h6v1h-6zM6 8h6v1h-6zM6 9h5v1h-5zM6 10h4v1h-4zM6 11h2v1h-2z"/></svg></span>
        <span class="tool" aria-hidden="true"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M9 0h2v1h-2zM8 1h4v1h-4zM8 2h4v1h-4zM8 3h3v1h-3zM7 4h2v1h-2zM6 5h2v1h-2zM5 6h2v1h-2zM4 7h2v1h-2zM1 8h4v1h-4zM0 9h4v1h-4zM0 10h4v1h-4zM1 11h2v1h-2z"/></svg></span>
      </div>
      <a class="compass" href="#top" aria-label="Back to top">
        <svg viewBox="0 0 32 32" fill="#b3ab92"><path d="M16 3l4 5h-8zM16 29l-4-5h8z" stroke="none"/><rect x="14" y="14" width="4" height="4" stroke="none"/><path d="M7 10a9 9 0 0 0 0 12M25 10a9 9 0 0 1 0 12" fill="none" stroke-width="2"/></svg>
      </a>

{{{content}}}

      <p class="foot">{{footer}}</p>
    </main>
  </div>
</div>
<script src="site.js"></script>
</body>
</html>
